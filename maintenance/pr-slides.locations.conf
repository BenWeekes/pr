# Include inside the sa-dev.agora.io HTTPS server block.
location = /pr {
    return 308 /pr/;
}

location ^~ /pr/ {
    alias /home/ubuntu/pr/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;

    # Publish the TOC and dated presentations. Repository files stay private
    # on this web server; the original templates are available in GitHub.
    if ($uri ~ "/\.") {
        return 404;
    }
    if ($uri !~ "^/pr/(|index\.html|catalog\.css|catalog\.js|presentations\.js|[0-9]{4}-[0-9]{2}-[0-9]{2}-[A-Za-z0-9]+(-[A-Za-z0-9]+)*(/(index\.html|styles\.css|app\.js|slides\.js|(assets|media)/.+)?)?)$") {
        return 404;
    }
}
